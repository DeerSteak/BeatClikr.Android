name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM_VERSION: "37.0"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate non-production CI audio
        run: python3 tools/generate_ci_audio.py

      - name: Verify Gradle wrapper
        run: test -x gradlew || chmod +x gradlew

      - name: Run unit tests, lint, and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  instrumentation:
    name: Instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 37]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate non-production CI audio
        run: python3 tools/generate_ci_audio.py

      - name: Verify Gradle wrapper
        run: test -x gradlew || chmod +x gradlew

      - name: Run emulator contract tests
        # v2.37.0
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.bfunkstudios.beatclikr.ExampleInstrumentedTest,com.bfunkstudios.beatclikr.InstantMetronomeViewTest,com.bfunkstudios.beatclikr.AudioEngineInstrumentedTest,com.bfunkstudios.beatclikr.StandardMetronomeContractInstrumentedTest,com.bfunkstudios.beatclikr.AccentContractInstrumentedTest,com.bfunkstudios.beatclikr.PolyrhythmContractInstrumentedTest
