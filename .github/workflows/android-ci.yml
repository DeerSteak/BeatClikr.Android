name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM_VERSION: "37.0"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate non-production CI audio
        run: python3 tools/generate_ci_audio.py

      - name: Verify Gradle wrapper
        run: test -x gradlew || chmod +x gradlew

      - name: Run unit tests, lint, and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  instrumentation:
    name: Instrumentation (API ${{ matrix.api-label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: "31"
            api-label: "31"
            arch: x86_64
            runner: ubuntu-latest
          - api-level: "36"
            api-label: "36"
            arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate non-production CI audio
        run: python3 tools/generate_ci_audio.py

      - name: Verify Gradle wrapper
        run: test -x gradlew || chmod +x gradlew

      - name: Enable KVM
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator contract tests
        # v2.37.0
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: ${{ matrix.api-level }}
          arch: ${{ matrix.arch }}
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          pre-emulator-launch-script: adb start-server
          script: >-
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.bfunkstudios.beatclikr.ExampleInstrumentedTest,com.bfunkstudios.beatclikr.InstantMetronomeViewTest,com.bfunkstudios.beatclikr.AudioEngineInstrumentedTest,com.bfunkstudios.beatclikr.StandardMetronomeContractInstrumentedTest,com.bfunkstudios.beatclikr.AccentContractInstrumentedTest,com.bfunkstudios.beatclikr.PolyrhythmContractInstrumentedTest
